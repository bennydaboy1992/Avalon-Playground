<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Protocol Shift 3.4 — Quarantine, Decoys & Caches</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#091725;color:#dff5ff;font:15px system-ui;text-align:center}main{max-width:580px;margin:auto}canvas{width:100%;background:#142b3b;border-radius:12px}button{touch-action:none;background:#24506a;color:white;border:1px solid #69a2bf;border-radius:10px;padding:12px;font-size:17px;font-weight:bold;min-height:52px}button:disabled{opacity:.4}.pad{display:grid;grid-template-columns:repeat(3,70px);gap:5px;justify-content:center}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:3}.pad button:last-child{grid-column:2}.row{display:flex;gap:8px;justify-content:center;margin:10px 0}#shift.ready{background:#087ca0;box-shadow:0 0 14px cyan}#status{min-height:38px;color:#9fe8ff}</style><main><h2>PROTOCOL SHIFT // QUARANTINE PROTOCOL 3.4</h2><div id="info"></div><canvas id="c" width="280" height="196"></canvas><p id="status">Loading...</p><div class="pad"><button data-d="0,-1">UP</button><button data-d="-1,0">LEFT</button><button data-d="1,0">RIGHT</button><button data-d="0,1">DOWN</button></div><div class="row"><button id="shift">SHIFT</button><button id="use">USE</button><button id="decoy">DECOY (0)</button><button id="restart">Restart</button></div><div class="row"><button data-l="0">Easy</button><button data-l="1">Medium</button><button data-l="2">Hard</button></div><small>H Trojan (12s); X disables F firewall; Q quarantine alarm; D decoy pickup; $ bonus data cache. Use DECOY to distract guards.</small></main><script>
const L=[
{m:['##########','#.B..#...#','#....#...#','#..X.F...#','#S...#..C#','#..$Q#...#','##########'],g:[{k:'S',p:[[7,1],[8,1],[8,2],[7,2],[6,2],[6,1]]}]},
{m:['##############','#.B..#...#...#','#..D.#...#...#','#..X.F.H.r.Q..#','#S...#...#..C#','#....#...#...#','##############'],g:[{k:'S',p:[[7,1],[8,1],[8,2],[7,2]]},{k:'M',p:[[11,1],[12,1],[12,2],[11,2]]}]},
{m:['################','#.B..#....#....#','#..D.#..R.#....#','#..X.F..H.r.Q..#','#S...#....#..C#','#....#..h.#.h..#','#....#....#....#','################'],g:[{k:'S',p:[[7,1],[8,1],[9,1],[9,2],[8,2],[7,2]]},{k:'M',p:[[12,1],[13,1],[14,1],[14,2],[13,2],[12,2]]},{k:'E',p:[[12,6],[13,6],[14,6],[14,5],[13,5],[12,5]]}]}];let level=0,P,G,held=new Set(),ended=false,last=0,alert=0,fireOff=false,trojan=0,horseTaken=false,decoys=0,decoyTarget=null,decoyTime=0,cacheTaken=new Set(),cacheCount=0,quarantineCooldown=0;const decoyButton=document.querySelector('#decoy');const use=document.querySelector('#use');const c=document.querySelector('#c'),ctx=c.getContext('2d'),status=document.querySelector('#status'),shift=document.querySelector('#shift');const at=(x,y)=>L[level].m[Math.floor(y)]?.[Math.floor(x)]||'#';function reset(n=level){level=n;let m=L[n].m,y=m.findIndex(r=>r.includes('S'));P={x:m[y].indexOf('S')+.5,y:y+.5,id:'N'};G=L[n].g.map(g=>({k:g.k,p:g.p,i:0,x:g.p[0][0]+.5,y:g.p[0][1]+.5,dx:1,dy:0,state:'patrol',target:null,search:0}));ended=false;alert=0;fireOff=false;trojan=0;horseTaken=false;decoys=0;decoyTarget=null;decoyTime=0;cacheTaken=new Set();cacheCount=0;quarantineCooldown=0;held.clear();status.textContent='Reach a coloured station, then SHIFT.';document.querySelector('#info').textContent=['EASY — FIREWALL','MEDIUM — TROJAN HORSE','HARD — FULL INFILTRATION'][n];sync()}function sync(){decoyButton.disabled=decoys===0||ended;decoyButton.textContent='DECOY ('+decoys+')';use.disabled=at(P.x,P.y)!=='X'||fireOff||ended;shift.disabled=!('BR'.includes(at(P.x,P.y))&&P.id!==at(P.x,P.y))||ended;shift.classList.toggle('ready',!shift.disabled)}function blocked(x,y){let t=at(x,y);return t==='#'||t==='F'&&!fireOff||t==='b'&&P.id!=='B'&&trojan<=0||t==='r'&&P.id!=='R'&&trojan<=0}function sight(g){let x=P.x-g.x,y=P.y-g.y,f=x*g.dx+y*g.dy,s=Math.abs(x*g.dy-y*g.dx);if(f<=0||f>2.6||s>f*.55)return false;for(let i=1;i<12;i++){let t=i/12;if(at(g.x+x*t,g.y+y*t)==='#')return false}return true}function update(dt){if(ended)return;decoyTime=Math.max(0,decoyTime-dt);quarantineCooldown=Math.max(0,quarantineCooldown-dt);if(decoyTime===0)decoyTarget=null;trojan=Math.max(0,trojan-dt);if(at(P.x,P.y)==='H'&&!horseTaken){horseTaken=true;trojan=12;status.textContent='TROJAN HORSE ACQUIRED — 12 SECONDS OF UNIVERSAL GATE ACCESS!'}alert=Math.max(0,alert-dt);let here=at(P.x,P.y),key=Math.floor(P.x)+','+Math.floor(P.y);if(here==='D'&&!cacheTaken.has('D'+key)){cacheTaken.add('D'+key);decoys++;status.textContent='DECOY ACQUIRED';sync()}if(here==='$'&&!cacheTaken.has('$'+key)){cacheTaken.add('$'+key);cacheCount++;status.textContent='DATA CACHE RECOVERED'}if(here==='Q'&&P.id!=='R'&&quarantineCooldown===0){quarantineCooldown=4;alert=5;for(let g of G){g.state='investigate';g.target={x:P.x,y:P.y}}status.textContent='QUARANTINE BREACH!'}let dx=(held.has('1,0')?1:0)-(held.has('-1,0')?1:0),dy=(held.has('0,1')?1:0)-(held.has('0,-1')?1:0),len=Math.hypot(dx,dy);if(len){dx/=len;dy/=len;let nx=P.x+dx*dt*2.8,ny=P.y+dy*dt*2.8,r=.19;if(![[-r,-r],[r,r],[-r,r],[r,-r]].some(([a,b])=>blocked(nx+a,P.y+b)))P.x=nx;if(![[-r,-r],[r,r],[-r,r],[r,-r]].some(([a,b])=>blocked(P.x+a,ny+b)))P.y=ny;sync()}for(let g of G){let n=g.p[(g.i+1)%g.p.length],tx=n[0]+.5,ty=n[1]+.5,x=tx-g.x,y=ty-g.y,d=Math.hypot(x,y);if(d<.03){g.i=(g.i+1)%g.p.length;n=g.p[(g.i+1)%g.p.length];x=n[0]+.5-g.x;y=n[1]+.5-g.y;d=Math.hypot(x,y)}if(decoyTarget&&decoyTime>0){g.state='investigate';g.target=decoyTarget}if(g.state==='investigate'&&g.target){let tx=g.target.x-g.x,ty=g.target.y-g.y;if(Math.hypot(tx,ty)<.3){g.state='search';g.search=1.8}else{let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(v=>({x:Math.floor(g.x)+v[0]+.5,y:Math.floor(g.y)+v[1]+.5})).filter(v=>at(v.x,v.y)!=='#');opts.sort((a,b)=>Math.hypot(a.x-g.target.x,a.y-g.target.y)-Math.hypot(b.x-g.target.x,b.y-g.target.y));if(opts.length){x=opts[0].x-g.x;y=opts[0].y-g.y;d=Math.hypot(x,y)}}}if(g.state==='search'){g.search-=dt;g.dx=Math.cos(g.search*3);g.dy=Math.sin(g.search*3);if(g.search<=0){g.state='patrol';g.target=null}}else if(d>.001){g.dx=x/d;g.dy=y/d;let step=Math.min(dt*(g.k==='E'?1.05:1.25),d);g.x+=g.dx*step;g.y+=g.dy*step}if(Math.hypot(P.x-g.x,P.y-g.y)<.45){ended=true;status.textContent='INTERCEPTED! Restart to retry.';held.clear();break}if(sight(g)&&at(P.x,P.y)!=='h'){if(g.k==='E'){alert=4;for(let a of G){a.state='investigate';a.target={x:P.x,y:P.y}}status.textContent='ELITE ALERT! Guards investigating your last position.'}else if(!(g.k==='S'&&P.id==='R'||g.k==='M'&&P.id==='B')||alert>0){ended=true;status.textContent='ANTIVIRUS INTERCEPTED YOU!';held.clear();break}}}if(at(P.x,P.y)==='C'){ended=true;held.clear();status.textContent='// SYSTEM OVERRIDDEN // — YOU WIN! CACHES: '+cacheCount}}function draw(){let m=L[level].m,u=28;c.width=m[0].length*u;c.height=m.length*u;for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++){let t=m[y][x];ctx.fillStyle=t==='#'?'#091522':t==='F'?(fireOff?'#225342':'#a84326'):t==='X'?'#685e30':t==='H'?'#654a81':t==='Q'?'#8d303e':t==='D'?'#276e77':t==='$'?'#3b7452':'BRbr'.includes(t)?t.toLowerCase()==='b'?'#235b78':'#763f50':t==='C'?'#23704d':'#264155';ctx.fillRect(x*u+.5,y*u+.5,u-1,u-1);if('BRbrCFXHQD$'.includes(t)){ctx.fillStyle=t==='C'?'#a0ffbd':t==='F'?'#ffca7e':t==='X'?'#fff1a2':t==='H'?'#d9b4ff':t==='Q'?'#ff9a9e':t==='D'?'#8df7ff':t==='$'?'#b1ffc6':t.toLowerCase()==='b'?'#67ddff':'#ff9ca6';ctx.textAlign='center';ctx.font='bold 19px system-ui';ctx.fillText(t==='C'?'◆':t==='F'?(fireOff?'✓':'♨'):t==='X'?'⚡':t==='H'?(horseTaken?'·':'♞'):t==='Q'?'⚠':t==='D'?(cacheTaken.has('D'+x+','+y)?'·':'◈'):t==='$'?(cacheTaken.has('$'+x+','+y)?'·':'$'):'BR'.includes(t)?'◎':'▣',(x+.5)*u,(y+.73)*u)}}for(let g of G){let a=Math.atan2(g.dy,g.dx),r=2.6*u;ctx.beginPath();ctx.moveTo(g.x*u,g.y*u);ctx.lineTo(g.x*u+r*Math.cos(a-.5),g.y*u+r*Math.sin(a-.5));ctx.lineTo(g.x*u+r*Math.cos(a+.5),g.y*u+r*Math.sin(a+.5));ctx.closePath();ctx.fillStyle=g.k==='E'?'#ba90ff55':g.k==='M'?'#62e8e855':'#ffbc6855';ctx.fill();ctx.strokeStyle=g.k==='E'?'#ba90ff':g.k==='M'?'#62e8e8':'#ffbc68';ctx.stroke();ctx.beginPath();ctx.arc(g.x*u,g.y*u,10,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill();ctx.fillStyle='#102333';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(g.k,g.x*u,g.y*u+4)}ctx.beginPath();ctx.arc(P.x*u,P.y*u,10,0,7);ctx.fillStyle=trojan>0?'#dbb5ff':P.id==='B'?'#64dbff':P.id==='R'?'#ff91a2':'#f2fbff';ctx.fill();ctx.fillStyle='#13293b';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(trojan>0?'H':'AI',P.x*u,P.y*u+3);if(trojan>0){ctx.fillStyle='#dfbaff';ctx.font='bold 12px system-ui';ctx.fillText(Math.ceil(trojan)+'s',P.x*u,P.y*u-15)}}function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}document.querySelectorAll('[data-d]').forEach(b=>{let d=b.dataset.d;const down=e=>{e.preventDefault();held.add(d);try{b.setPointerCapture(e.pointerId)}catch{}};const up=e=>{e.preventDefault();held.delete(d)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',()=>held.delete(d))});decoyButton.onclick=()=>{if(decoys>0&&!ended){decoys--;decoyTarget={x:P.x,y:P.y};decoyTime=5;for(let g of G){g.state='investigate';g.target={...decoyTarget}}status.textContent='DECOY DEPLOYED!';sync()}};use.onclick=()=>{if(at(P.x,P.y)==='X'&&!fireOff){fireOff=true;status.textContent='FIREWALL DISABLED — PATH CLEAR';sync()}};shift.onclick=()=>{let t=at(P.x,P.y);if('BR'.includes(t)&&P.id!==t){P.id=t;status.textContent='// SHIFTED // '+(t==='B'?'MAINTENANCE':'SECURITY');sync()}};document.querySelector('#restart').onclick=()=>reset();document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>reset(+b.dataset.l));window.addEventListener('blur',()=>held.clear());reset();requestAnimationFrame(loop);
